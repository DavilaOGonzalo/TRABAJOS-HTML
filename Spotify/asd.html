<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body{
            background-color: black;
            padding: 8px;
            margin: 0;
        }


        .r0{
            position: relative;
            width: 25%;
            height: 42px;
            background-color: rgb(0, 0, 0); /*rojo*/

            float: left;
            margin-right: 8px;
            margin-bottom: 8px;
        }

        

        .b0{
            position: absolute;
            width: 42px;
            height: 42px;
            background-color: rgb(0, 0, 0); /*naranja*/

            float: left;
            left: 21px;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo{
            width: 38px;
            height: 38px;
        }

        .r1{
            position: relative;
            width: 48.942%;
            height: 42px;
            background-color: rgb(0, 0, 0); /*morado*/

            float: left;
            margin-bottom: 8px;

        }

        .b1{
            position: absolute;
            width: 42px;
            height: 42px;
            background-color: rgb(40, 40, 40); /*azul*/

            left: 13%;
            
            border-radius: 50%;
        }

        .b2{
            position: absolute;
            width: calc(74% - 91px);
            height: 42px;
            background-color: rgb(40, 40, 40); /*amarillo*/

            right: calc(13% + 21px);
        }

        .radius0{
            position: absolute;
            width: 42px;
            height: 42px;
            background-color: rgb(40, 40, 40); /*rosa*/

            left: calc(13% + 50px);
            
            border-radius: 50%;
        }

        .radius1{
            position: absolute;
            width: 42px;
            height: 42px;
            background-color: rgb(40, 40, 40); /*verde*/

            right: 13%;
            
            border-radius: 50%;
        }


        .r2{
            position: relative;
            width: 25%;
            height: 42px;
            background-color: rgb(92, 87, 249); /*morado*/    

            float: right;
            margin-left: 8px;
            margin-bottom: 8px;
        }

        .b3{
            position: absolute;
            width: 42px;
            height: 42px;
            background-color: lightblue; /*celeste*/

            float: right;
            margin-left: 8px;
        }

        #perfil{
            position: absolute;
            width: 42px;
            height: 42px;
            background-color: rgb(40, 40, 40); /*celeste oscuro*/

            right: 0;

            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #social{
            
        }

        #novedades{
            
        }

        .b4{
            position: absolute;
            width: calc(55% - 42px);
            height: 42px;
            background-color: rgb(25, 108, 89); /*verde*/

            left: 0;
        }

        .cont1{
            width: 25%;
            height: 545px;
            background-color: rgb(173, 230, 186); /*verde claro*/

            float: left;
            margin-right: 8px;
            border-radius: 1%;
        }

        .cont2{
            width: 48.942%;;
            height: 545px;
            background-color: rgb(230, 173, 203); /*rosa*/

            float: left;
            border-radius: 1%;
        }

        .cont3{
            width: 25%;;
            height: 545px;
            background-color: rgb(179, 75, 84); /*rojo claro*/

            float: right;

        }

        

    
        

        


        

        



    </style>
</head>
<body>
    <div class="r0">
        <div class="b0">
            <img class="logo" src="/pngwing.com (21).png" alt="spotify-logo">
        </div>
    </div>

    <div class="r1">
        <div class="b1"></div>
        <div class="b2"></div>
        <div class="radius0"></div>
        <div class="radius1"></div>
    </div>
    
    <div class="r2">
        <div class="b3" id="perfil">
            <img class="configuracion-perfiles" src="/" alt="">
        </div>
        <div class="b3" id="social"></div>
        <div class="b3" id="novedades"></div>
        <div class="b4"></div>
    </div>
    <div>
        <div class="cont1"></div>
    </div>
    <div>
        <div class="cont2"></div>
    </div>
    <div>
        <div class="cont3"></div>
    </div>
</body>
</html>
